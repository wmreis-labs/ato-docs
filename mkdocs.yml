site_name: ATO
site_description: Documentação pública de product discovery do ATO.
site_url: https://wmreis-labs.github.io/ato-docs/
repo_url: https://github.com/wmreis-labs/ato-docs
repo_name: wmreis-labs/ato-docs
docs_dir: docs

theme:
  name: material
  language: pt
  logo: assets/ato-logo-mark.svg
  favicon: assets/ato-logo-mark.svg
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - pt
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Contexto do projeto: project-context.md
  - Identidade visual: identidade.md
  - Decisões MVP: decisoes-mvp.md
  - Arquitetura MVP: arquitetura-mvp.md
  - Matriz de permissões: matriz-permissoes.md
  - Auth (aprovação): auth-approval.md
  - Mapa das 14 telas: telas.md
  - Front (console): front.md
  - Anexos:
      - anexos/index.md
      - Fit da stack (Fase 3): anexos/stack-fit-fase3.md
      - Evolution API: anexos/evolution-api-fit.md
